[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "churn"
version = "0.1.0"
description = "CHURN: Harvest → Unify → Refine → Normalize. Universal legacy-to-OKF converter (community reference for Google Open Knowledge Format)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  {name = "churn contributors"}
]
keywords = ["okf", "knowledge", "import", "legacy", "markdown", "ekg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "typer>=0.12.0",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
]
# For rich document extraction in File driver (opportunistic)
parse = [
  "unstructured[pdf,docx]>=0.14",
  "python-docx>=1.1",
  "pdfminer.six>=20231228",
]
s3 = [
  "boto3>=1.34",
]

[project.scripts]
churn = "churn.cli:app"

[project.entry-points."churn.drivers"]
# Drivers are discovered here. Example after pip install churn-driver-foo:
# foo = "churn_driver_foo:FooDriver"

[tool.hatch.build.targets.wheel]
packages = ["churn"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
markers = [
    "network: tests that hit the real network (deselect with -m 'not network')"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# M005.002 Nuitka single-binary stub (per M005-LAUNCH.md)
# To produce standalone exe: pip install nuitka ; python -m nuitka --standalone --onefile churn/cli.py --output-dir dist
# (or use pyproject script hook). Produces churn.exe (or .bin) containing full runtime + deps.
# Future: add [project.scripts] or hatch/nuitka plugin; keep boring for now, no extra runtime dep.
# Test: after build, ./dist/churn --version works offline.
